# MCP bundle (`.mcpb`) for nokk-mcp: `npx @anthropic-ai/mcpb pack mcpb`.
# The host installs these dependencies with uv; the bundle carries no code of
# its own beyond src/server.py.
[project]
name = "nokk-mcpb"
version = "0.1.47a1"
description = "nokk MCP server as an MCP bundle"
requires-python = ">=3.10"
dependencies = ["nokk-mcp>=0.1.47a1", "nokk>=0.1.47a1"]

[tool.uv]
package = false
