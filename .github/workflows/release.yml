name: release

# Push a tag like v0.1.0-alpha to build and publish both artifacts:
#   * a Linux x86_64 binary attached to the GitHub Release
#   * a container image pushed to ghcr.io/<owner>/nokk
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the Release + upload the binary
  packages: write   # push the image to GHCR

jobs:
  binary:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build inside Debian 11 (bullseye, glibc 2.31) so the binary runs on a broad
      # range of Linux — RHEL/Alma 9 (2.34), Ubuntu 20.04+, Debian 11+ — instead of
      # the runner's glibc 2.39 (which would need 2.38+). checkout/release stay on
      # the host (JS actions need node, which the minimal container lacks).
      - name: Build (Debian bullseye — broad glibc floor ~2.30)
        run: |
          docker run --rm -v "$PWD:/w" -w /w rust:1-bullseye bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends clang libclang-dev pkg-config python3-pip
            pip3 install cmake                                    # apt cmake (3.18) < BoringSSL req (3.22)
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name "libclang.so*" | head -1)")"
            cargo build --release --bin nokk'

      - name: Package
        run: |
          tar -czf "nokk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release nokk

      # Second artifact: the same binary with the opt-in rasterizers compiled in
      # (docs/rendering.md). `render` needs nothing extra at runtime; `webgl`
      # dlopen's libEGL, so it only lights up where Mesa is installed (and falls
      # back to the JS synthesis where it isn't). Built in the same bullseye
      # container for the same broad glibc floor.
      - name: Build render variant (--features render,webgl)
        run: |
          docker run --rm -v "$PWD:/w" -w /w rust:1-bullseye bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends clang libclang-dev pkg-config python3-pip
            pip3 install cmake
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name "libclang.so*" | head -1)")"
            cargo build --release -p nokk-cli --features render,webgl --bin nokk'
          tar -czf "nokk-render-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release nokk

      - name: Publish to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nokk-${{ github.ref_name }}-linux-x86_64.tar.gz
            nokk-render-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
          # SEO-oriented lead (keyword-rich); the auto-generated changelog is
          # appended below it by generate_release_notes.
          body: |
            **nokk ${{ github.ref_name }}** — an **undetectable headless browser engine** in
            **Rust**: real **V8** JavaScript + a DOM with a coherent **Chrome TLS/HTTP
            fingerprint (JA3/JA4)** and JS-level **anti-bot stealth**, driven over the
            **Chrome DevTools Protocol** so existing **Puppeteer** code just connects. No
            Chromium, no rendering. Good for **stealth web scraping**, **Cloudflare / anti-bot
            bypass**, and high-concurrency automation with **per-context proxy rotation**.

            ### Run it
            ```bash
            docker run --rm -p 9222:9222 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            # or the Linux x86_64 binary attached below
            ```
            Point Puppeteer at `ws://localhost:9222/devtools/browser/nokk`.

            ### Real canvas / WebGL rasterization (optional)
            The `nokk-render-*` binary and the `:render` image below carry the
            opt-in rasterizers: a real `tiny-skia` canvas 2D and a genuine headless
            WebGL context, so `toDataURL` / `getImageData` / `readPixels` return
            true pixels instead of a synthesized pattern. The `:render` image ships
            the Mesa stack WebGL needs; the standalone binary needs `libegl1` +
            `libgl1-mesa-dri` on the host for WebGL (canvas 2D needs nothing).
            ```bash
            docker run --rm -p 9222:9222 ghcr.io/${{ github.repository }}:${{ github.ref_name }}-render
            ```

            > Keywords: undetectable headless browser · anti-bot bypass · Cloudflare bypass ·
            > JA3/JA4 TLS fingerprint · browser fingerprint spoofing · stealth web scraping ·
            > Puppeteer-compatible · headless Chrome alternative · Rust.

            ---

  image:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Default / smallest image: distroless. Tagged latest + version + :distroless.
      - name: Metadata (distroless)
        id: meta_distroless
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=distroless

      - name: Build and push (distroless)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: distroless
          push: true
          tags: ${{ steps.meta_distroless.outputs.tags }}
          labels: ${{ steps.meta_distroless.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Debian variant (has a shell for debugging): :debian + :<version>-debian.
      - name: Build and push (debian)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: debian
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:debian
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-debian
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Render variant: the binary built with --features render,webgl plus the
      # Mesa runtime the WebGL backend dlopen's. :render + :<version>-render.
      - name: Build and push (render)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: render
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:render
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-render
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
