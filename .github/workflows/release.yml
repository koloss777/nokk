name: release

# Push a tag like v0.1.0-alpha to build and publish both artifacts:
#   * binaries attached to the GitHub Release: Linux x86_64 (light and render),
#     Linux ARM64, macOS on Apple Silicon, Windows x64
#   * a container image pushed to ghcr.io/<owner>/nokk
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the Release + upload the binary
  packages: write   # push the image to GHCR

jobs:
  binary:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # annotated tag objects, for the release notes below

      - name: Version from the tag
        if: github.ref_type == 'tag'
        run: echo "NOKK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # What actually changed in *this* release comes from the tag's own
      # annotation (`git tag -a v0.1.23-alpha -m '…'`), so the notes are written
      # once, at the moment of tagging, by whoever knows what shipped — instead of
      # the same boilerplate on every release. Empty for a lightweight tag, in
      # which case the auto-generated commit list below carries the whole story.
      - name: Release notes from the tag annotation
        id: notes
        run: |
          git fetch --force --tags --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          {
            echo "body<<NOKK_EOF"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo "NOKK_EOF"
          } >> "$GITHUB_OUTPUT"

      # Build inside Debian 11 (bullseye, glibc 2.31) so the binary runs on a broad
      # range of Linux — RHEL/Alma 9 (2.34), Ubuntu 20.04+, Debian 11+ — instead of
      # the runner's glibc 2.39 (which would need 2.38+). checkout/release stay on
      # the host (JS actions need node, which the minimal container lacks). It is a
      # `docker build` of .github/bullseye-build.Dockerfile rather than a `docker run`:
      # apt cannot take its locks inside a plain container under the runner's docker,
      # while a build step installs fine (the image job builds the same way).
      - name: Build (Debian bullseye — broad glibc floor ~2.30)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target bin-out --build-arg NOKK_VERSION \
            --output type=local,dest=out/bin .
          tar -czf "nokk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C out/bin nokk

      # Second artifact: the same binary with the opt-in rasterizers compiled in
      # (docs/rendering.md). `render` needs nothing extra at runtime; `webgl`
      # dlopen's libEGL, so it only lights up where Mesa is installed (and falls
      # back to the JS synthesis where it isn't). The Dockerfile chains this stage
      # after the first, so the build reuses that target dir.
      - name: Build render variant (--features render,webgl)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target bin-render-out --build-arg NOKK_VERSION \
            --output type=local,dest=out/render .
          tar -czf "nokk-render-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C out/render nokk

      - name: Publish to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nokk-${{ github.ref_name }}-linux-x86_64.tar.gz
            nokk-render-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
          # One-line lead (what nokk is, for anyone landing here cold), then what
          # *this* tag shipped, then run instructions. The commit changelog is
          # appended underneath by generate_release_notes.
          body: |
            An undetectable headless browser engine in Rust — real V8 + DOM behind a
            coherent Chrome TLS/HTTP fingerprint (JA3/JA4), driven over CDP so existing
            Puppeteer code just connects. No Chromium.

            ## What's in ${{ github.ref_name }}

            ${{ steps.notes.outputs.body }}

            ## Run it
            ```bash
            docker run --rm -p 9222:9222 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            # :<version>-render for real canvas/WebGL pixels · or the binaries below:
            # Linux x86_64 / ARM64, macOS (Apple Silicon), Windows x64
            ```
            Point Puppeteer at `ws://localhost:9222/devtools/browser/nokk`.
            Full docs: [README](https://github.com/${{ github.repository }}#readme).

            ---

  # Linux ARM64, macOS Apple Silicon and Windows x64, the light build each, added to
  # the release the x86 job created. Same steps as ports.yml, where they were brought up.
  binary-ports:
    name: Build ${{ matrix.name }}
    needs: binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-15 }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        if: github.ref_type == 'tag'
        run: echo "NOKK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (Debian bullseye, as the x86 binary)
        if: runner.os == 'Linux'
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target bin-out --build-arg NOKK_VERSION --output type=local,dest=out .
          tar -czf "nokk-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C out nokk

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'

      # One coherent SDK: a CommandLineTools include path mixed with the Xcode SDK
      # breaks BoringSSL's C++ build.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          SDK="$(xcrun --show-sdk-path)"
          export SDKROOT="$SDK" CXXFLAGS="-isystem $SDK/usr/include/c++/v1"
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cargo build --release --bin nokk
          tar -czf "nokk-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C target/release nokk

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --bin nokk
          7z a "nokk-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" ./target/release/nokk.exe >/dev/null

      - name: Smoke (no network)
        run: |
          B=out/nokk; [ -f "$B" ] || B=target/release/nokk; [ -f "$B" ] || B=target/release/nokk.exe
          "$B" --version
          "$B" --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5)].join(' | ')"

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nokk-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
            nokk-${{ github.ref_name }}-${{ matrix.name }}.zip
          fail_on_unmatched_files: false

  image:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        if: github.ref_type == 'tag'
        run: echo "NOKK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Default / smallest image: distroless. Tagged latest + version + :distroless.
      - name: Metadata (distroless)
        id: meta_distroless
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=distroless

      - name: Build and push (distroless)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: distroless
          build-args: NOKK_VERSION=${{ env.NOKK_VERSION }}
          push: true
          tags: ${{ steps.meta_distroless.outputs.tags }}
          labels: ${{ steps.meta_distroless.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Debian variant (has a shell for debugging): :debian + :<version>-debian.
      - name: Build and push (debian)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: debian
          build-args: NOKK_VERSION=${{ env.NOKK_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:debian
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-debian
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Render variant: the binary built with --features render,webgl plus the
      # Mesa runtime the WebGL backend dlopen's. :render + :<version>-render.
      - name: Build and push (render)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: render
          build-args: NOKK_VERSION=${{ env.NOKK_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:render
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-render
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
