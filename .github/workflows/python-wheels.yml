name: python-wheels

# Build and publish the `nokk` PyPI launcher wheel — a wheel that *embeds* the
# prebuilt `nokk` binary, so `pip install nokk` needs no Rust toolchain, no
# BoringSSL build, and no Docker on the user's machine.
#
# Built in the same Debian bullseye image as the release binary
# (.github/bullseye-build.Dockerfile); maturin auditwheel-repairs the wheel to a
# manylinux_2_31 tag, which covers RHEL/Alma 9, Ubuntu 20.04+ and Debian 11+.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the tag: v0.1.20-alpha -> 0.1.20a1 (PEP 440). Done on the
      # host; the container builds against the edited python/pyproject.toml.
      - name: Sync wheel version from the tag
        if: github.ref_type == 'tag'
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          PEP="${RAW/-alpha/a1}"; PEP="${PEP/-beta/b1}"; PEP="${PEP/-rc./rc}"
          echo "wheel version: $PEP"
          sed -i "s/^version = \".*\"/version = \"$PEP\"/" python/pyproject.toml
          echo "NOKK_VERSION=$RAW" >> "$GITHUB_ENV"

      # Build in Debian 11 (bullseye, glibc 2.31) so the embedded binary runs on a
      # broad range of Linux (RHEL/Alma 9, Ubuntu 20.04+, Debian 11+) — matching the
      # release binary. maturin auditwheel-repairs to a manylinux_2_31 tag. A
      # `docker build` of .github/bullseye-build.Dockerfile, not a `docker run`: apt
      # cannot take its locks inside a plain container under the runner's docker.
      # The context carries the pyproject.toml edited above.
      - name: Build wheel (Debian bullseye — broad glibc floor ~2.30)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target wheel-out --build-arg NOKK_VERSION \
            --output type=local,dest=python/dist .

      - name: Sanity-check the wheel embeds the binary
        run: |
          python3 - <<'PY'
          import glob, zipfile
          whl = glob.glob("python/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith(".data/scripts/nokk") for n in names), \
              f"binary not embedded in wheel: {names}"
          print("ok:", whl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: python/dist/*.whl

  # Linux ARM64, macOS Apple Silicon and Windows x64 wheels.
  build-ports:
    name: Build ${{ matrix.name }} wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-14 }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Sync wheel version from the tag
        if: github.ref_type == 'tag'
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          PEP="${RAW/-alpha/a1}"; PEP="${PEP/-beta/b1}"; PEP="${PEP/-rc./rc}"
          sed -i.bak "s/^version = \".*\"/version = \"$PEP\"/" python/pyproject.toml && rm python/pyproject.toml.bak
          echo "NOKK_VERSION=$RAW" >> "$GITHUB_ENV"

      - name: Build wheel (Debian bullseye, as the x86 wheel)
        if: runner.os == 'Linux'
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target wheel-out --build-arg NOKK_VERSION \
            --output type=local,dest=python/dist .

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          SDK="$(xcrun --show-sdk-path)"
          export SDKROOT="$SDK" CXXFLAGS="-isystem $SDK/usr/include/c++/v1"
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          pip install "maturin>=1.7,<2"
          cd python && maturin build --release --out dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          pip install "maturin>=1.7,<2"
          cd python && maturin build --release --out dist

      - name: Sanity-check the wheel embeds the binary
        run: |
          PYBIN=$(command -v python3 || command -v python)
          "$PYBIN" - <<'PY'
          import glob, zipfile
          whl = glob.glob("python/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith((".data/scripts/nokk", ".data/scripts/nokk.exe")) for n in names), \
              f"binary not embedded in wheel: {names}"
          print("ok:", whl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build, build-ports]
    runs-on: ubuntu-latest
    # The x86 wheel goes out even if a newer platform failed to build.
    if: always() && github.ref_type == 'tag' && needs.build.result == 'success'
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC) — configure the publisher on the PyPI
      # project first (owner koloss777, repo nokk, workflow python-wheels.yml,
      # environment pypi); no API token secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # `nokk-mcp` (python-mcp/): the MCP server's own command, `uvx nokk-mcp`,
  # published at the same version as `nokk` once `nokk` is out. Trusted
  # Publishing again: the PyPI project needs a publisher for this workflow
  # (owner koloss777, repo nokk, workflow python-wheels.yml, environment pypi).
  publish-mcp:
    name: Publish nokk-mcp to PyPI
    needs: [publish]
    runs-on: ubuntu-latest
    if: always() && github.ref_type == 'tag' && needs.publish.result == 'success'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build nokk-mcp at the tag's version
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          PEP="${RAW/-alpha/a1}"; PEP="${PEP/-beta/b1}"; PEP="${PEP/-rc./rc}"
          cd python-mcp
          sed -i "s/^version = \".*\"/version = \"$PEP\"/" pyproject.toml
          sed -i "s/\"nokk>=[^\"]*\"/\"nokk>=$PEP\"/" pyproject.toml
          grep -E '^version|nokk>=' pyproject.toml
          python3 -m pip install --quiet build
          python3 -m build --outdir dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-mcp/dist
