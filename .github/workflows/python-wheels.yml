name: python-wheels

# Build and publish the `nokk` PyPI launcher wheel — a wheel that *embeds* the
# prebuilt `nokk` binary, so `pip install nokk` needs no Rust toolchain, no
# BoringSSL build, and no Docker on the user's machine.
#
# Built on a plain Ubuntu runner (same environment as release.yml, which builds
# the binary green) rather than a manylinux container — maturin auditwheel-repairs
# to a manylinux_2_XX tag automatically, matching a local `maturin build`. The
# glibc floor is that of the runner (Ubuntu 22.04 → manylinux_2_35), which covers
# current distros; a lower floor would need the BoringSSL build to work inside an
# old manylinux image, which it doesn't yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the tag: v0.1.20-alpha -> 0.1.20a1 (PEP 440). Done on the
      # host; the container builds against the edited python/pyproject.toml.
      - name: Sync wheel version from the tag
        if: github.ref_type == 'tag'
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          PEP="${RAW/-alpha/a1}"; PEP="${PEP/-beta/b1}"; PEP="${PEP/-rc./rc}"
          echo "wheel version: $PEP"
          sed -i "s/^version = \".*\"/version = \"$PEP\"/" python/pyproject.toml

      # Build in Debian 11 (bullseye, glibc 2.31) so the embedded binary runs on a
      # broad range of Linux (RHEL/Alma 9, Ubuntu 20.04+, Debian 11+) — matching the
      # release binary. maturin auditwheel-repairs to a manylinux_2_31 tag.
      - name: Build wheel (Debian bullseye — broad glibc floor ~2.30)
        run: |
          docker run --rm -v "$PWD:/w" -w /w rust:1-bullseye bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends clang libclang-dev pkg-config python3 python3-pip patchelf
            pip3 install --upgrade pip
            pip3 install cmake maturin                            # apt cmake (3.18) < BoringSSL req (3.22)
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name "libclang.so*" | head -1)")"
            cd python && maturin build --release --out dist'

      - name: Sanity-check the wheel embeds the binary
        run: |
          python3 - <<'PY'
          import glob, zipfile
          whl = glob.glob("python/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith(".data/scripts/nokk") for n in names), \
              f"binary not embedded in wheel: {names}"
          print("ok:", whl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC) — configure the publisher on the PyPI
      # project first (owner koloss777, repo nokk, workflow python-wheels.yml,
      # environment pypi); no API token secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
