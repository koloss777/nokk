name: ports

# Linux ARM64, macOS Apple Silicon and Windows x64: build, test, smoke-run, keep the binary as an
# artifact for testing on real hardware. Manual (or on a change to this file) until
# both are steadily green;
# releases do not use it yet. Jobs do not fail the run while the ports are brought up.
concurrency:
  group: ports-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ports.yml, Cargo.toml, Cargo.lock, "crates/*/Cargo.toml", "crates/*/build.rs", python/pyproject.toml, .github/bullseye-build.Dockerfile]

jobs:
  linux-arm64:
    name: linux arm64
    continue-on-error: true   # bring-up: read results per job, no failure mail
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The same bullseye image as the x86_64 release, so the glibc floor matches.
      - name: Build (Debian bullseye)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target bin-out \
            --output type=local,dest=out .
          tar -czf nokk-linux-aarch64.tar.gz -C out nokk

      - uses: actions/upload-artifact@v4
        with:
          name: nokk-linux-aarch64
          path: nokk-linux-aarch64.tar.gz

      - name: Smoke
        run: |
          ./out/nokk --version
          ./out/nokk --eval "(document.title = 'ok', document.title + (1 + 1))"
          ./out/nokk --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5), new Intl.PluralRules('ru').select(2)].join(' | ')"

      # Datacenter addresses get a harder time from Cloudflare: informative only.
      - name: Public Cloudflare pages
        continue-on-error: true
        run: NOKK=./out/nokk tools/cf-check.sh

  linux-arm64-test:
    name: linux arm64 tests
    continue-on-error: true   # bring-up: read results per job, no failure mail
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config cmake
      - name: Test
        run: |
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name 'libclang.so*' | head -1)")"
          cargo test --release --workspace

  macos-arm64:
    name: macos apple silicon
    continue-on-error: true   # bring-up: read results per job, no failure mail
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # One coherent SDK: a CommandLineTools include path mixed with the Xcode SDK
      # breaks BoringSSL's C++ build.
      - name: Configure libclang and the SDK
        run: |
          SDK="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --release --bin nokk
          tar -czf nokk-macos-aarch64.tar.gz -C target/release nokk

      - uses: actions/upload-artifact@v4
        with:
          name: nokk-macos-aarch64
          path: nokk-macos-aarch64.tar.gz

      - name: Test
        continue-on-error: true   # the smoke and the pages below run either way
        run: cargo test --release --workspace

      - name: Smoke
        run: |
          ./target/release/nokk --version
          ./target/release/nokk --eval "(document.title = 'ok', document.title + (1 + 1))"
          ./target/release/nokk --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5), new Intl.PluralRules('ru').select(2)].join(' | ')"

      - name: Public Cloudflare pages
        continue-on-error: true
        run: |
          brew install coreutils >/dev/null   # cf-check.sh uses GNU timeout
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          NOKK=./target/release/nokk tools/cf-check.sh

  windows-x64:
    name: windows x64
    continue-on-error: true   # bring-up: read results per job, no failure mail
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --bin nokk
          7z a nokk-windows-x64.zip ./target/release/nokk.exe >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: nokk-windows-x64
          path: nokk-windows-x64.zip

      - name: Test
        continue-on-error: true   # the smoke and the pages below run either way
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo test --release --workspace

      - name: Smoke
        run: |
          ./target/release/nokk.exe --version
          ./target/release/nokk.exe --eval "(document.title = 'ok', document.title + (1 + 1))"
          ./target/release/nokk.exe --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5), new Intl.PluralRules('ru').select(2)].join(' | ')"

      - name: Public Cloudflare pages
        continue-on-error: true
        run: NOKK=./target/release/nokk.exe tools/cf-check.sh

  wheels:
    name: wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-15 }
          - { name: windows-x86_64, os: windows-latest }
    continue-on-error: true   # bring-up
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel (Debian bullseye, as the x86 wheel)
        if: runner.os == 'Linux'
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target wheel-out \
            --output type=local,dest=python/dist .

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          SDK="$(xcrun --show-sdk-path)"
          export SDKROOT="$SDK" CXXFLAGS="-isystem $SDK/usr/include/c++/v1"
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          pip install "maturin>=1.7,<2"
          cd python && maturin build --release --out dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          pip install "maturin>=1.7,<2"
          cd python && maturin build --release --out dist

      - name: Sanity-check the wheel embeds the binary
        run: |
          PYBIN=$(command -v python3 || command -v python)
          "$PYBIN" - <<'PY'
          import glob, zipfile
          whl = glob.glob("python/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith((".data/scripts/nokk", ".data/scripts/nokk.exe")) for n in names), \
              f"binary not embedded in wheel: {names}"
          print("ok:", whl)
          PY
