[package]
name = "nokk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface and CDP server binary for the nokk headless browser engine."
repository.workspace = true
keywords = ["headless-browser", "stealth", "scraping", "cli", "puppeteer"]
categories = ["command-line-utilities", "web-programming"]

[features]
# Light by default: no rasterizer, no GL stack. A Cloudflare solve peaks ~100 MB
# lower without them (WebGL alone maps Mesa and LLVM), and every challenge we
# test clears either way. `--features render,webgl` builds the binary with real
# canvas/WebGL pixels — the `nokk-render` release archive and the `:render`
# image (docs/rendering.md).
default = []
# Real off-screen canvas rasterization: tiny-skia + ab_glyph, pure Rust.
render = ["nokk/render"]
# Real headless WebGL. Loads libEGL at run time and falls back to the drawn
# surface where Mesa/EGL is absent, so it is safe to build in everywhere.
webgl = ["nokk/webgl"]

[[bin]]
name = "nokk"
path = "src/main.rs"

[dependencies]
nokk = { workspace = true }
nokk-net = { workspace = true }
nokk-stealth = { workspace = true }
nokk-cdp = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
percent-encoding = "2"
