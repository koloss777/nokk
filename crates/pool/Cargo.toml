[package]
name = "nokk-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "V8 isolate worker pool with backpressure — the concurrency core of the nokk headless browser engine."
repository.workspace = true
keywords = ["v8", "isolate", "concurrency", "browser", "pool"]
categories = ["concurrency", "web-programming"]

[features]
default = []
# Opt-in real off-screen rasterization: back the JS canvas with a real tiny-skia
# 2D rasterizer (genuine getImageData/toDataURL pixels) instead of the default JS
# synthesis. Heavier build; see docs/rendering.md. Not on by default.
render = ["dep:tiny-skia"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Real 2D rasterizer for the optional `render` feature (pure Rust, no GPU).
tiny-skia = { version = "0.11", optional = true }

# Embedded JavaScript engine (Phase 1). Uses a prebuilt V8 static library, so it
# does not compile V8 from source. One `v8::OwnedIsolate` lives per worker thread.
v8 = "137"

# Native WebCrypto primitives exposed to each context (see src/natives.rs).
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { workspace = true }
getrandom = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
