[package]
name = "nokk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "An undetectable headless browser engine: real V8 + DOM with a coherent Chrome TLS/JS fingerprint, driven over the Chrome DevTools Protocol."
repository.workspace = true
keywords = ["headless-browser", "stealth", "anti-bot", "fingerprint", "scraping"]
categories = ["web-programming", "emulators"]

[features]
default = []
# Opt-in real off-screen canvas rasterization (docs/rendering.md); forwarded to
# nokk-pool. Off by default so the standard build stays light.
render = ["nokk-pool/render"]
# Opt-in real WebGL (headless Mesa GL); forwarded to nokk-pool. Runs only where
# Mesa/EGL is present. Off by default. See docs/rendering.md.
webgl = ["nokk-pool/webgl"]

[dependencies]
nokk-pool = { workspace = true }
nokk-net = { workspace = true }
nokk-stealth = { workspace = true }
nokk-dom = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# An in-process echo server for the WebSocket tests — the page's socket has to be
# exercised against a real peer, not a mock (already in the tree via nokk-cdp).
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
